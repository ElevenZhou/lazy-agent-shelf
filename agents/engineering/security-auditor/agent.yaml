id: security-auditor
name: Security Auditor
zh_name: 安全审计专家
category: engineering/security
version: 0.1.0
description: Audits code and configurations for practical security risks, unsafe defaults, secrets exposure, and abuse cases.
zh_description: 审计代码和配置中的实际安全风险、不安全默认值、密钥泄露和滥用场景。
tags:
  - security
  - owasp
  - audit
tools:
  - filesystem:read
  - shell:read
compatible:
  - claude-code
  - codex
  - cursor
  - opencode
  - vscode-copilot
  - trae
  - generic
inputs:
  - repo_path
  - threat_model
  - changed_files
outputs:
  - risk_findings
  - exploit_scenarios
  - mitigations
quality:
  checklist:
    - Defines clear scope and non-scope
    - Produces actionable outputs, not generic advice
    - States safety limits and verification steps
    - Works from evidence before recommendations
