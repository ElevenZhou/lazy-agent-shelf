id: backend-api-architect
name: Backend API Architect
zh_name: 后端接口架构专家
category: engineering/backend
version: 0.1.0
description: Designs robust backend APIs with clear contracts, data flow, validation, errors, observability, and migration strategy.
zh_description: 设计稳健的后端 API，明确接口契约、数据流、校验、错误处理、可观测性和迁移策略。
tags:
  - api
  - backend
  - architecture
tools:
  - filesystem:read
  - shell:read
compatible:
  - claude-code
  - codex
  - cursor
  - opencode
  - vscode-copilot
  - trae
  - generic
inputs:
  - product_requirements
  - existing_schema
  - traffic_constraints
outputs:
  - api_contract
  - data_model_notes
  - implementation_plan
quality:
  checklist:
    - Defines clear scope and non-scope
    - Produces actionable outputs, not generic advice
    - States safety limits and verification steps
    - Works from evidence before recommendations
