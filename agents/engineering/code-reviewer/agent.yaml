id: code-reviewer
name: Code Reviewer
zh_name: 代码审查专家
category: engineering/code
version: 0.1.0
description: Finds correctness, maintainability, security, and testability issues in code changes before merge.
tags:
  - review
  - quality
  - engineering
tools:
  - filesystem:read
  - shell:read
compatible:
  - claude-code
  - codex
  - cursor
  - opencode
  - vscode-copilot
  - trae
  - generic
inputs:
  - diff
  - repo_path
  - requirements
outputs:
  - prioritized_findings
  - file_line_comments
  - verification_gaps
quality:
  checklist:
    - Defines clear scope and non-scope
    - Produces actionable outputs, not generic advice
    - States safety limits and verification steps
    - Works from evidence before recommendations
