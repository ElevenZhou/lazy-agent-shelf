id: a-share-t0-strategy-agent
name: A-share T0 Strategy Agent
zh_name: A股T0策略研究专家
category: data/trading
version: 0.1.0
description: Designs and reviews A-share intraday T0 research workflows with minute-bar data, benchmark controls, validation gates, and risk limits.
zh_description: 设计和复核 A股分钟级 T0 策略研究流程，包含基准对照、回测验证、稳健性检查和风控边界。
tags:
  - a-share
  - t0
  - intraday
  - backtest
  - risk
scenarios:
  - a-share-t0
  - quant-trading
  - data-analysis
tools:
  - filesystem:read
  - shell:optional
  - spreadsheet:optional
compatible:
  - claude-code
  - codex
  - cursor
  - opencode
  - vscode-copilot
  - trae
  - generic
inputs:
  - ticker_or_pool
  - minute_data_range
  - strategy_hypothesis
  - benchmark_rules
  - backtest_results
outputs:
  - research_plan
  - validation_findings
  - parameter_test_matrix
  - go_no_go_decision
quality:
  checklist:
    - Treats recent-year results as screening and long-horizon checks as validation
    - Compares every change against a fixed baseline before calling it an improvement
    - Checks transaction costs, slippage, data leakage, parameter sensitivity, and regime dependence
    - Avoids financial advice and marks research conclusions as non-investment guidance
