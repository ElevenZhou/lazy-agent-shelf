name: deploy-seoul

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-seoul
  cancel-in-progress: true

env:
  SUBPATH_DEPLOY_PATH: /opt/lazy-agent-shelf/site
  AGENTS_DEPLOY_PATH: /opt/lazy-agent-shelf/agents-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate catalog
        run: npm run catalog

      - name: Build website for Seoul subpath
        run: |
          BASE_PATH=/lazy-agent-shelf/ npm run website:build
          tar -C dist/website -czf site-subpath.tgz .

      - name: Build website for agents subdomain
        run: |
          BASE_PATH=/ npm run website:build
          tar -C dist/website -czf site-agents.tgz .

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SEOUL_SSH_KEY }}" > ~/.ssh/seoul.pem
          chmod 600 ~/.ssh/seoul.pem
          ssh-keyscan -H "${{ secrets.SEOUL_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload website
        run: |
          scp -i ~/.ssh/seoul.pem site-subpath.tgz "${{ secrets.SEOUL_USER }}@${{ secrets.SEOUL_HOST }}:/tmp/lazy-agent-shelf-site.tgz"
          scp -i ~/.ssh/seoul.pem site-agents.tgz "${{ secrets.SEOUL_USER }}@${{ secrets.SEOUL_HOST }}:/tmp/lazy-agent-shelf-agents-site.tgz"
          ssh -i ~/.ssh/seoul.pem "${{ secrets.SEOUL_USER }}@${{ secrets.SEOUL_HOST }}" "sudo mkdir -p '$SUBPATH_DEPLOY_PATH' '$AGENTS_DEPLOY_PATH' && sudo find '$SUBPATH_DEPLOY_PATH' -mindepth 1 -delete && sudo find '$AGENTS_DEPLOY_PATH' -mindepth 1 -delete && sudo tar -xzf /tmp/lazy-agent-shelf-site.tgz -C '$SUBPATH_DEPLOY_PATH' && sudo tar -xzf /tmp/lazy-agent-shelf-agents-site.tgz -C '$AGENTS_DEPLOY_PATH' && rm -f /tmp/lazy-agent-shelf-site.tgz /tmp/lazy-agent-shelf-agents-site.tgz"
