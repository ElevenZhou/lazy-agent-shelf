name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint agents
        run: npm run lint:agents

      - name: Generate website catalog
        run: npm run catalog

      - name: Build platform outputs
        run: npm run build:agents

      - name: Build website
        run: npm run website:build
