    name: 本地图像生成器
    category: ai/image
    tags: [codex, gpt-image-2, image-generation, website-assets, workflow, laozhou-a]
    one_liner: 让 Codex 调用本地 gpt-image-2 工具生成图片，同时保存同名提示词并复制到项目资源目录。
    best_for: [网站 hero 背景, 项目插图素材, 需要保留 prompt 溯源的设计迭代, Codex 内部自动化生图流程]
