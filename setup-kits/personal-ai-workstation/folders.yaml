root:
  windows: "D:/Workspace"
  mac: "$HOME/Workspace"
folders:
  - path: "Projects"
    purpose: "代码项目"
  - path: "AI"
    purpose: "AI 工具配置、模型、工作流"
  - path: "AI/Models"
    purpose: "本地模型"
  - path: "AI/ComfyUI"
    purpose: "ComfyUI 工作区"
  - path: "Services"
    purpose: "New API、CLIProxyAPI、FRP 等服务"
  - path: "Documents"
    purpose: "重要文档"
  - path: "Downloads/Installers"
    purpose: "安装包归档"
  - path: "Scripts"
    purpose: "自用脚本"
  - path: "Backups"
    purpose: "配置备份"
