  - id: local-image-generator-public-draft
    horizon: short
    status: active
    title: 本地图像生成 Skill 公开草案
    goals:
      - 将工具路径改为 LOCAL_IMAGE_GENERATOR_DIR 或跨平台默认目录。
      - 把 dev/image-generator 整理成可分享模板，仅包含 .env.example。
      - 在飞流AI枢纽中以 draft 状态展示，明确适合场景、边界和风险。
    updated_at: 2026-05-15
    last_modified_at: 2026-05-15
  - id: dev-workspace-inventory-maintenance
    horizon: recurring
    status: active
    title: I:\Dev 项目管理清单维护
    goals:
      - 每周刷新 I:\Dev\项目管理清单.md。
      - 关注近 14 天活跃项目、Git dirty 项目和涉及 .env/服务器/支付的敏感目录。
      - 不自动读取密钥、不提交其他项目源码，只更新管理清单。
    updated_at: 2026-05-15
    last_modified_at: 2026-05-15
  - id: post-wechat-moments-iteration
    horizon: short
    status: active
    title: 发图文朋友圈 Skill 迭代
    goals:
      - 收集 3-5 次真实朋友圈发布样例，补充合作邀约、能力展示、轻转化和记录分享模板。
      - 评估是否加入固定图片卡片排版脚本，减少每次手动生成中文图文卡的成本。
      - 与本地图像生成 Skill 联动，形成“文案 + 方图 + 图片顺序”的稳定发布工作流。
    updated_at: 2026-05-15
    last_modified_at: 2026-05-15
  - id: newcomer-ai-onboarding-guides
    horizon: short
    status: active
    title: 新人 AI 工作入门指南体系
    goals:
      - 把新人 AI 工作指南接入入门指南栏目。
      - 继续补充 Codex / Trae / WorkBuddy 的具体上手路径和示例提问。
      - 把有效经验沉淀为可复用的工作流、记忆或 Skill。
    updated_at: 2026-05-15
    last_modified_at: 2026-05-15

  - id: seoul-node-monitor-hardening
    horizon: short
    status: active
    title: 首尔节点监控台加固与迭代
    goals:
      - 给 https://flaios.com/node-monitor/ 增加 Basic Auth 或可信 IP 限制。
      - 新国家节点上线后，通过 seoul-node-onboarding Skill 自动更新 Caddy 与监控展示。
      - 继续优化节点列表的信息密度、异常优先级和地区健康概览。
      - 保持只读原则，不在网页开放 Caddy/frps 配置修改能力。
    updated_at: 2026-05-17
    last_modified_at: 2026-05-17

  - id: crs2-cluster-management-doc-sync
    horizon: short
    status: active
    title: CRS2.0 集群管理文档同步与巡检
    goals:
      - 统一根 README、docs/README、00-OVERVIEW 和 02-NODES-AND-PORTS 的 2026-05-25 状态口径。
      - 补齐 N06/N09 的 Netdata 与 Kuma 状态，并用 cluster-check 对账 pillar、installed、running 三方状态。
      - 规划 N03/N07/SG01 游离部署招安路径，先记录现状和风险，再逐台标准化。
      - 扩展救援脚本与 cluster-check 的 crs-app 检查能力，减少人工读节点 receipt 的成本。
    updated_at: 2026-05-25
    last_modified_at: 2026-05-25

  - id: youyou-cs2-prd-breakdown
    horizon: short
    status: active
    title: 悠悠有品 CS2 产品化拆解
    goals:
      - 先拆 CS2 行情与库存 MVP PRD，覆盖首页、商品详情页、库存页、价格提醒和异动榜。
      - 拆租赁套装与会员 PRD，明确套装生成、会员权益、押金规则和履约风控。
      - 固化合规红线清单，避免下注、博彩、杠杆、收益承诺和受限地区导流。
      - 中长期再评估 B2B 官方交易系统、交易 SDK、风控、分账和数据服务。
    updated_at: 2026-05-25
    last_modified_at: 2026-05-25

  - id: hardcore-series-sample-pipeline
    horizon: short
    status: active
    title: 硬核系列样片与审核流水线
    goals:
      - 优先开发第 1 集、第 10 集、第 40 集三支样片，验证穿越开局、知识可视化和商业爽点。
      - 将每集开发卡十字段整理成 Markdown、Base 或在线表单模板。
      - 把 L1-L4 知识风险等级和中高风险表达边界做成开播前审核 Checklist。
      - 第一部节奏跑通后，再启动第 61-120 集分集开发和衍生系列试探。
    updated_at: 2026-05-25
    last_modified_at: 2026-05-25

  - id: short-drama-topic-review-selection
    horizon: short
    status: active
    title: 12 部短剧选题评审收敛
    goals:
      - 组织编剧团队用爽点强度、投流潜力、制作成本和合规风险四维打分。
      - 从 12 部中选出 Top 3-5 进入剧本扩写和阶段目标设计。
      - 为爆款引流长剧名扩展 3-5 个标题 A/B 变体，先做小流量测试。
      - 对股市、金融、战争、乱世和出海题材做合规预筛。
    updated_at: 2026-05-25
    last_modified_at: 2026-05-25
