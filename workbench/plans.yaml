  - id: setup-kit-next
    horizon: short
    status: active
    title: 环境套件下一步
    goals:
      - 继续补软件官方链接。
      - 支持 setup export zip。
      - 拆分公开网站清单与私有历史清单。
    updated_at: 2026-05-13
