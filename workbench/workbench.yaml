id: personal-master-os
name: 个人工作台
version: 0.1.0
updated_at: 2026-05-15
positioning: 个人资产、项目状态、关系、进展、风险和计划的结构化状态层，供 Agent 读取、更新和展示。
principles:
  - 只呈现情况，不直接管理或编辑真实项目文件。
  - 本地优先，GitHub 负责版本历史。
  - Agent 可以更新状态文件，但高风险事实需要用户确认。
  - Markdown 给人读，YAML 给网站和 Agent 读。
modules:
  - assets
  - projects
  - relations
  - progress
  - risks
  - plans
